<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" role="img" aria-label="React allocates a new element tree on every render and diffs it node by node; melact builds only an array of hole values and compares each with ===, then writes the changed holes"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><text x="0" y="18" font-size="14" xml:space="preserve" font-weight="600">React with a virtual DOM</text><rect x="0" y="32" width="152" height="68" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="76" y="71" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">setState</text><line x1="154" y1="66" x2="178" y2="66" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow-muted)"/><rect x="182" y="32" width="152" height="68" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="258" y="71" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">render component</text><line x1="336" y1="66" x2="360" y2="66" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow-muted)"/><rect x="364" y="32" width="152" height="68" rx="12" fill="#2b1d12" stroke="#f0883e" stroke-width="1.4"/><text x="440" y="62" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">new element tree</text><text x="440" y="82" font-size="11.5" xml:space="preserve" class="orange" text-anchor="middle">every tag allocated</text><line x1="518" y1="66" x2="542" y2="66" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow-muted)"/><rect x="546" y="32" width="152" height="68" rx="12" fill="#2b1d12" stroke="#f0883e" stroke-width="1.4"/><text x="622" y="62" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">diff the trees</text><text x="622" y="82" font-size="11.5" xml:space="preserve" class="orange" text-anchor="middle">node by node</text><line x1="700" y1="66" x2="724" y2="66" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow-muted)"/><rect x="728" y="32" width="152" height="68" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="804" y="71" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">commit changes</text><text x="0" y="150" font-size="14" xml:space="preserve" font-weight="600">melact</text><rect x="0" y="164" width="152" height="68" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="76" y="203" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">setState</text><line x1="154" y1="198" x2="178" y2="198" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="182" y="164" width="152" height="68" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="258" y="203" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">render component</text><line x1="336" y1="198" x2="360" y2="198" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="364" y="164" width="152" height="68" rx="12" fill="#221a38" stroke="#b58cff" stroke-width="1.4"/><text x="440" y="194" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">hole array</text><text x="440" y="214" font-size="11.5" xml:space="preserve" class="accent" text-anchor="middle">static markup: nothing</text><line x1="518" y1="198" x2="542" y2="198" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="546" y="164" width="152" height="68" rx="12" fill="#221a38" stroke="#b58cff" stroke-width="1.4"/><text x="622" y="194" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">=== per hole</text><text x="622" y="214" font-size="11.5" xml:space="preserve" class="accent" text-anchor="middle">no tree to walk</text><line x1="700" y1="198" x2="724" y2="198" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="728" y="164" width="152" height="68" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="804" y="203" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor