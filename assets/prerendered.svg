<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 546" width="896" height="546" role="img" aria-label="The first page is already in index.html. dune renders the initial view natively; the browser paints before the code loads, and the code resumes it. Rendered at build time. One dune rule: page.mlx, with the model, update, view and the initial model, builds natively under -server into render.exe, which prints the first page with Program.render (or ReactDOMServer.renderToString for Melact); melhole-prerender --capture main shell.html puts that HTML right inside the empty root of the app&#x27;s own index.html, refusing a filled root, and puts the capture script in the head; index.html is what the server sends, with a small script that loads the bundle after the first paint. In the browser, a mounted page shows an empty root until the bundle has been fetched, parsed and run and the view has mounted, and only then paints; the page built at build time paints as soon as the HTML is parsed, then the bundle, loaded by a small script after that first frame, resumes it, listening without running any view, and the first input takes it over and is then handled. The takeover keeps every element the build sent and creates none of them again; clicks before the code arrives wait in the capture script and are replayed, and a page that does not match the view is mounted anew"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #59636e; } .faint { fill: #8c959f; }.accent { fill: #8250df; } .green { fill: #1a7f37; }.orange { fill: #bc4c00; } .blue { fill: #0969da; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">RENDERED AT BUILD TIME</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">The first page is already in index.html</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">dune renders the initial view natively; the browser paints before the code loads, and the code resumes it.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><text x="0" y="12" font-size="11" xml:space="preserve" class="muted" font-weight="800">AT BUILD TIME · ONE DUNE RULE</text><rect x="0" y="24" width="202" height="150" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4" filter="url(#lift)"/><text x="16" y="50" font-size="13.5" xml:space="preserve" font-weight="700">page.mlx</text><text x="16" y="68" font-size="11.5" xml:space="preserve" class="muted">model, update, view, init</text><text x="16" y="96" font-size="11.5" xml:space="preserve" class="mono"><tspan class="faint">let </tspan><tspan class="orange">init</tspan> = { rows = [] }</text><text x="16" y="115" font-size="11.5" xml:space="preserve" class="mono"><tspan class="faint">let </tspan><tspan class="accent">view</tspan> model =</text><text x="16" y="134" font-size="11.5" xml:space="preserve" class="mono">  &lt;div className=…&gt;</text><text x="16" y="153" font-size="11.5" xml:space="preserve" class="mono"><tspan class="faint">builds natively too</tspan></text><rect x="226" y="24" width="202" height="150" rx="14" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1.4" filter="url(#lift)"/><text x="242" y="50" font-size="13.5" xml:space="preserve" class="green" font-weight="700">render.exe</text><text x="242" y="68" font-size="11.5" xml:space="preserve" class="muted">-server, native, no DOM</text><text x="242" y="96" font-size="11.5" xml:space="preserve" class="mono"><tspan class="green">Program.render</tspan></text><text x="242" y="115" font-size="11.5" xml:space="preserve" class="mono">  ~view:Page.<tspan class="accent">view</tspan></text><text x="242" y="134" font-size="11.5" xml:space="preserve" class="mono">  Page.<tspan class="orange">init</tspan></text><text x="242" y="153" font-size="11.5" xml:space="preserve" class="mono"><tspan class="faint">prints the first page</tspan></text><line x1="204" y1="99" x2="222" y2="99" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#arrow-green)" class="flow"/><rect x="452" y="24" width="202" height="150" rx="14" fill="#f5f0ff" stroke="#8250df" stroke-width="1.4" filter="url(#lift)"/><text x="468" y="50" font-size="13.5" xml:space="preserve" class="accent" font-weight="700">melhole-prerender</text><text x="468" y="68" font-size="11.5" xml:space="preserve" class="muted">into the empty root</text><text x="468" y="96" font-size="11.5" xml:space="preserve" class="mono"><tspan class="accent">--capture main</tspan></text><text x="468" y="115" font-size="11.5" xml:space="preserve" class="mono">  shell.html</text><text x="468" y="134" font-size="11.5" xml:space="preserve" class="mono">&lt; the HTML on stdin</text><text x="468" y="153" font-size="11.5" xml:space="preserve" class="mono"><tspan class="faint">refuses a filled root</tspan></text><line x1="430" y1="99" x2="448" y2="99" stroke="#8250df" stroke-width="1.8" marker-end="url(#arrow-accent)" class="flow"/><rect x="678" y="24" width="202" height="150" rx="14" fill="#eef6ff" stroke="#0969da" stroke-width="1.4" filter="url(#lift)"/><text x="694" y="50" font-size="13.5" xml:space="preserve" class="blue" font-weight="700">index.html</text><text x="694" y="68" font-size="11.5" xml:space="preserve" class="muted">what the server sends</text><text x="694" y="96" font-size="11.5" xml:space="preserve" class="mono">&lt;head&gt;…&lt;script&gt;<tspan class="blue">capture</tspan></text><text x="694" y="115" font-size="11.5" xml:space="preserve" class="mono">&lt;div id=&#x27;main&#x27;&gt;</text><text x="694" y="134" font-size="11.5" xml:space="preserve" class="mono">  &lt;div class=…&gt;<tspan class="green">…</tspan></text><text x="694" y="153" font-size="11.5" xml:space="preserve" class="mono">&lt;script&gt;<tspan class="accent">after the paint</tspan></text><line x1="656" y1="99" x2="674" y2="99" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow-blue)" class="flow"/><text x="0" y="214" font-size="11" xml:space="preserve" class="muted" font-weight="800">IN THE BROWSER</text><text x="0" y="268" font-size="13" xml:space="preserve" font-weight="700">mounted</text><line x1="150" y1="263" x2="880" y2="263" stroke="#d0d7de" stroke-width="1"/><text x="0" y="338" font-size="13" xml:space="preserve" font-weight="700">built</text><line x1="150" y1="333" x2="880" y2="333" stroke="#d0d7de" stroke-width="1"/><rect x="150" y="248" width="112" height="30" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="206.0" y="268" font-size="11.5" xml:space="preserve" font-weight="600" text-anchor="middle">HTML: empty</text><rect x="268" y="248" width="332" height="30" rx="8" fill="#fff4e8" stroke="#bc4c00" stroke-width="1.2"/><text x="434.0" y="268" font-size="11.5" xml:space="preserve" font-weight="600" text-anchor="middle">fetch, parse, run the bundle; mount: view, clone, fill</text><circle cx="624" cy="263" r="7" fill="#1a7f37" class="pulse"/><text x="624" y="240" font-size="11.5" xml:space="preserve" class="green" font-weight="700" text-anchor="middle">first paint</text><rect x="648" y="248" width="152" height="30" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="724.0" y="268" font-size="11.5" xml:space="preserve" font-weight="600" text-anchor="middle">live, handles input</text><rect x="150" y="318" width="112" height="30" rx="8" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1.2"/><text x="206.0" y="338" font-size="11.5" xml:space="preserve" font-weight="600" text-anchor="middle">HTML: the page</text><circle cx="286" cy="333" r="7" fill="#1a7f37" class="pulse"/><text x="286" y="310" font-size="11.5" xml:space="preserve" class="green" font-weight="700" text-anchor="middle">first paint</text><rect x="310" y="318" width="290" height="30" rx="8" fill="#f5f0ff" stroke="#8250df" stroke-width="1.2" stroke-dasharray="5 4"/><text x="455.0" y="338" font-size="11.5" xml:space="preserve" font-weight="600" text-anchor="middle">bundle loaded after it: resume listens, no view</text><line x1="640" y1="316" x2="640" y2="350" stroke="#0969da" stroke-width="2"/><text x="640" y="310" font-size="11.5" xml:space="preserve" class="blue" font-weight="700" text-anchor="middle">first input</text><rect x="652" y="318" width="148" height="30" rx="8" fill="#eef6ff" stroke="#0969da" stroke-width="1.2"/><text x="726.0" y="338" font-size="11.5" xml:space="preserve" font-weight="600" text-anchor="middle">take over, then handle</text><rect x="0" y="372" width="880" height="66" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="18" y="398" font-size="13" xml:space="preserve" font-weight="700">the takeover keeps every element the build sent and creates none of them again</text><text x="18" y="420" font-size="11.5" xml:space="preserve" class="muted">clicks before the code arrives wait in the capture script and are replayed; a page that does not match the view is mounted anew</text></g></svg>