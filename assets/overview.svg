<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 1116 664" width="1116" height="664" role="img" aria-label="A click writes one text node, chosen at build time. Two dune lines change. The compiler cuts your JSX into static HTML and holes, and writes down what each hole reads. A Melact counter button on the page and in code. melact-ppx cuts the unchanged reason-react JSX into static HTML, parsed once and cloned, and three holes: the text node, which reads count; the class, which reads the prop tone; and the click handler, set once at mount. It records at build time which value each hole reads. A click runs setCount, which marks count as changed; only the hole that reads count runs, and it writes 1 into its text node. The class hole reads tone, which did not change, so it does nothing. No tree is built and nothing is diffed. Gone: React, react-dom, the virtual DOM, fiber. Stays: your components, hooks, mlx, ReactDOM, React.Event."><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #59636e; } .faint { fill: #8c959f; }.accent { fill: #8250df; } .green { fill: #1a7f37; }.orange { fill: #bc4c00; } .blue { fill: #0969da; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">MELACT IN ONE PICTURE</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">A click writes one text node, chosen at build time</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">Two dune lines change. The compiler cuts your JSX into static HTML and holes, and writes down what each hole reads.</text><line x1="0" y1="76" x2="1100" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><text x="0" y="14" font-size="14" xml:space="preserve" font-weight="700">On the page</text><rect x="0" y="26" width="1100" height="150" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2" filter="url(#lift)"/><rect x="42" y="64" width="270" height="76" rx="16" fill="none" stroke="#1a7f37" stroke-width="1.3" stroke-dasharray="3 4"/><rect x="48" y="70" width="258" height="64" rx="12" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.4"/><text x="72" y="111" font-size="21" xml:space="preserve" class="faint" font-weight="700">Count:</text><rect x="156" y="82" width="56" height="40" rx="8" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="5 4"/><text x="184" y="110" font-size="21" xml:space="preserve" class="orange" font-weight="800" text-anchor="middle">0</text><rect x="234" y="58" width="76" height="24" rx="12" fill="#8250df" stroke="#8250df" stroke-width="1"/><text x="272" y="75" font-size="11.5" xml:space="preserve" class="mono" style="fill:#f6f8fa" font-weight="700" text-anchor="middle">onClick</text><text x="48" y="160" font-size="12" xml:space="preserve" class="muted">grey text: static, cloned from the template once</text><line x1="336" y1="102" x2="470" y2="102" stroke="#bc4c00" stroke-width="2" marker-end="url(#arrow-orange)" class="flow"/><text x="403" y="90" font-size="12.5" xml:space="preserve" class="orange" font-weight="700" text-anchor="middle">click</text><rect x="502" y="64" width="270" height="76" rx="16" fill="none" stroke="#1a7f37" stroke-width="1.3" stroke-dasharray="3 4"/><rect x="508" y="70" width="258" height="64" rx="12" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.4"/><text x="532" y="111" font-size="21" xml:space="preserve" class="faint" font-weight="700">Count:</text><rect x="616" y="82" width="56" height="40" rx="8" fill="#fff4e8" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="5 4" class="pulse"/><text x="644" y="110" font-size="21" xml:space="preserve" class="orange" font-weight="800" text-anchor="middle">1</text><rect x="694" y="58" width="76" height="24" rx="12" fill="#8250df" stroke="#8250df" stroke-width="1"/><text x="732" y="75" font-size="11.5" xml:space="preserve" class="mono" style="fill:#f6f8fa" font-weight="700" text-anchor="middle">onClick</text><text x="508" y="160" font-size="12" xml:space="preserve" class="orange" font-weight="700">one write: the text node now says 1</text><text x="820" y="62" font-size="13" xml:space="preserve" font-weight="700">three holes, and what each reads</text><text x="820" y="88" font-size="12.5" xml:space="preserve"><tspan class="orange">■ </tspan>text   reads <tspan class="orange" font-weight="800">count</tspan></text><text x="820" y="112" font-size="12.5" xml:space="preserve"><tspan class="green">■ </tspan>class  reads <tspan class="green" font-weight="800">tone</tspan><tspan class="muted">  (a prop)</tspan></text><text x="820" y="136" font-size="12.5" xml:space="preserve"><tspan class="accent">■ </tspan>onClick runs setCount</text><text x="820" y="160" font-size="12" xml:space="preserve" class="muted">the rest of the button never changes</text><text x="0" y="212" font-size="14" xml:space="preserve" font-weight="700">Your JSX, unchanged reason-react</text><rect x="0" y="224" width="400" height="190" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2" filter="url(#lift)"/><text x="20" y="258" font-size="12.5" xml:space="preserve" class="mono">let[@react.component] make ~<tspan class="green">tone</tspan> =</text><text x="20" y="280" font-size="12.5" xml:space="preserve" class="mono">  let <tspan class="orange">count</tspan>, setCount = React.useState ...</text><text x="20" y="302" font-size="12.5" xml:space="preserve" class="mono">  &lt;button className=<tspan class="green">tone</tspan></text><text x="20" y="324" font-size="12.5" xml:space="preserve" class="mono">    <tspan class="accent">onClick</tspan>=(fun _ -&gt; setCount ...)&gt;</text><text x="20" y="346" font-size="12.5" xml:space="preserve" class="mono">    (React.string &quot;Count: &quot;)</text><text x="20" y="368" font-size="12.5" xml:space="preserve" class="mono">    (React.int <tspan class="orange">count</tspan>)</text><text x="20" y="390" font-size="12.5" xml:space="preserve" class="mono">  &lt;/button&gt;</text><line x1="410" y1="318" x2="462" y2="318" stroke="#8250df" stroke-width="2" marker-end="url(#arrow-accent)"/><text x="436" y="306" font-size="12" xml:space="preserve" class="accent" font-weight="700" text-anchor="middle">build</text><text x="474" y="212" font-size="14" xml:space="preserve" font-weight="700">What melact-ppx makes of it</text><rect x="474" y="224" width="626" height="190" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2" filter="url(#lift)"/><text x="492" y="256" font-size="12.5" xml:space="preserve" class="mono">template = &quot;&lt;button&gt;Count: &lt;/button&gt;&quot;</text><text x="1084" y="256" font-size="11.5" xml:space="preserve" class="muted" text-anchor="end">static HTML, parsed once</text><text x="492" y="282" font-size="12.5" xml:space="preserve" class="mono"><tspan class="orange">text</tspan>  = button.lastChild</text><text x="1084" y="282" font-size="11.5" xml:space="preserve" class="orange" font-weight="700" text-anchor="end">hole, reads count</text><text x="492" y="308" font-size="12.5" xml:space="preserve" class="mono"><tspan class="green">class</tspan> = button.className</text><text x="1084" y="308" font-size="11.5" xml:space="preserve" class="green" font-weight="700" text-anchor="end">hole, reads tone</text><text x="492" y="334" font-size="12.5" xml:space="preserve" class="mono"><tspan class="accent">onClick</tspan> button (fun _ -&gt; setCount ...)</text><text x="1084" y="334" font-size="11.5" xml:space="preserve" class="accent" font-weight="700" text-anchor="end">hole, set once at mount</text><text x="492" y="360" font-size="12.5" xml:space="preserve" class="mono"><tspan class="orange">setCount</tspan> marks the bit of <tspan class="orange">count</tspan></text><text x="1084" y="360" font-size="11.5" xml:space="preserve" class="muted" text-anchor="end">known at build time</text><text x="492" y="386" font-size="12.5" xml:space="preserve" class="mono"><tspan class="orange">count</tspan> changed → <tspan class="orange">text</tspan>.data &lt;- count</text><text x="1084" y="386" font-size="11.5" xml:space="preserve" class="orange" font-weight="700" text-anchor="end">the only write</text><text x="0" y="450" font-size="14" xml:space="preserve" font-weight="700">What a click does</text><rect x="0" y="464" width="61.5" height="34" rx="17" fill="#f5f0ff" stroke="#8250df" stroke-width="1.2"/><text x="30.75" y="486" font-size="12" xml:space="preserve" class="mono accent" font-weight="700" text-anchor="middle">click</text><line x1="64.5" y1="481" x2="82.5" y2="481" stroke="#59636e" stroke-width="1.4" marker-end="url(#arrow-muted)"/><rect x="86.5" y="464" width="97.0" height="34" rx="17" fill="#f5f0ff" stroke="#8250df" stroke-width="1.2"/><text x="135.0" y="486" font-size="12" xml:space="preserve" class="mono accent" font-weight="700" text-anchor="middle">setCount 1</text><line x1="186.5" y1="481" x2="204.5" y2="481" stroke="#59636e" stroke-width="1.4" marker-end="url(#arrow-muted)"/><rect x="208.5" y="464" width="118.3" height="34" rx="17" fill="#fff4e8" stroke="#bc4c00" stroke-width="1.2"/><text x="267.65" y="486" font-size="12" xml:space="preserve" class="mono orange" font-weight="700" text-anchor="middle">bit count set</text><line x1="329.8" y1="481" x2="347.8" y2="481" stroke="#59636e" stroke-width="1.4" marker-end="url(#arrow-muted)"/><rect x="351.8" y="464" width="217.7" height="34" rx="17" fill="#fff4e8" stroke="#bc4c00" stroke-width="1.2"/><text x="460.65" y="486" font-size="12" xml:space="preserve" class="mono orange" font-weight="700" text-anchor="middle">holes that read count: text</text><line x1="572.5" y1="481" x2="590.5" y2="481" stroke="#59636e" stroke-width="1.4" marker-end="url(#arrow-muted)"/><rect x="594.5" y="464" width="125.39999999999999" height="34" rx="17" fill="#fff4e8" stroke="#bc4c00" stroke-width="1.2"/><text x="657.2" y="486" font-size="12" xml:space="preserve" class="mono orange" font-weight="700" text-anchor="middle">text.data &lt;- 1</text><line x1="722.9" y1="481" x2="740.9" y2="481" stroke="#59636e" stroke-width="1.4" marker-end="url(#arrow-muted)"/><rect x="744.9" y="464" width="246.1" height="34" rx="17" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1.2"/><text x="867.9499999999999" y="486" font-size="12" xml:space="preserve" class="mono green" font-weight="700" text-anchor="middle">class hole: tone did not change</text><text x="0" y="524" font-size="12.5" xml:space="preserve" class="muted">No tree is built and nothing is diffed: the markup is cloned once, and an update runs only the holes that read what changed.</text><text x="0" y="548" font-size="12.5" xml:space="preserve" font-weight="600">Gone: React, react-dom, the virtual DOM, fiber.  Stays: your components, hooks, mlx, ReactDOM, React.Event.  Starting fresh? Write Meltea.</text></g></svg>