<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 628" width="896" height="628" role="img" aria-label="Your reason-react code, compiled: no React underneath. Two dune lines change. Components, hooks and JSX stay; the build turns each JSX tree into a template and a refresh. Melact in one picture. 1: you keep a reason-react component unchanged; the whole migration is two dune lines. 2: Melact compiles it once, at build time, into a template with two holes, the click handler and the text n, the only places that can change, and a generated render: if n !== last then text.data = n, one compare per value and at most one write per change. 3: a click runs your set as before, only this component runs, n goes from 0 to 1 so one === fails, and text.data = 1 is the only DOM write. Gone: React, react-dom, the virtual DOM, a tree per render, the tree diff, fiber. Stays: your components, hooks, mlx, Reason and OCaml, ReactDOM, React.Event. Starting fresh? Write Meltea"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #59636e; } .faint { fill: #8c959f; }.accent { fill: #8250df; } .green { fill: #1a7f37; }.orange { fill: #bc4c00; } .blue { fill: #0969da; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">MELACT IN ONE PICTURE</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">Your reason-react code, compiled: no React underneath</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">Two dune lines change. Components, hooks and JSX stay; the build turns each JSX tree into a template and a refresh.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><circle cx="12" cy="14" r="12" fill="#8250df"/><text x="12" y="19" font-size="12.5" xml:space="preserve" style="fill:#ffffff" font-weight="800" text-anchor="middle">1</text><text x="32" y="19" font-size="15" xml:space="preserve" font-weight="700">You keep your code</text><text x="32" y="38" font-size="11.5" xml:space="preserve" class="muted">a reason-react component, unchanged</text><circle cx="317" cy="14" r="12" fill="#8250df"/><text x="317" y="19" font-size="12.5" xml:space="preserve" style="fill:#ffffff" font-weight="800" text-anchor="middle">2</text><text x="337" y="19" font-size="15" xml:space="preserve" font-weight="700">Melact compiles it, once</text><text x="337" y="38" font-size="11.5" xml:space="preserve" class="muted">at build time, per JSX tree</text><circle cx="622" cy="14" r="12" fill="#8250df"/><text x="622" y="19" font-size="12.5" xml:space="preserve" style="fill:#ffffff" font-weight="800" text-anchor="middle">3</text><text x="642" y="19" font-size="15" xml:space="preserve" font-weight="700">A click runs this</text><text x="642" y="38" font-size="11.5" xml:space="preserve" class="muted">in the browser, every render</text><rect x="0" y="54" width="270" height="166" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" filter="url(#lift)"/><text x="14" y="82" font-size="11.2" xml:space="preserve" class="mono">let[@react.component] make () =</text><text x="14" y="101" font-size="11.2" xml:space="preserve" class="mono">  let n, set =</text><text x="14" y="120" font-size="11.2" xml:space="preserve" class="mono">    React.useState (fun () -&gt; 0) in</text><text x="14" y="139" font-size="11.2" xml:space="preserve" class="mono">  &lt;button onClick=<tspan class="accent">(fun _ -&gt;</tspan></text><text x="14" y="158" font-size="11.2" xml:space="preserve" class="mono"><tspan class="accent">      set (fun n -&gt; n + 1))</tspan>&gt;</text><text x="14" y="177" font-size="11.2" xml:space="preserve" class="mono">    <tspan class="orange">(React.int n)</tspan></text><text x="14" y="196" font-size="11.2" xml:space="preserve" class="mono">  &lt;/button&gt;</text><rect x="0" y="232" width="270" height="82" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" filter="url(#lift)"/><text x="14" y="252" font-size="11.5" xml:space="preserve" class="muted" font-weight="600">the whole migration: two dune lines</text><text x="14" y="276" font-size="11" xml:space="preserve" class="mono orange">- (libraries reason-react)  + melact</text><text x="14" y="296" font-size="11" xml:space="preserve" class="mono green">- (pps reason-react-ppx)  + melact-ppx</text><rect x="305" y="54" width="270" height="260" rx="12" fill="#f6f8fa" stroke="#8250df" stroke-width="1.4" filter="url(#lift)"/><text x="321" y="78" font-size="12.5" xml:space="preserve" class="accent" font-weight="700">the template, made once</text><rect x="321" y="90" width="238" height="40" rx="8" fill="#f5f0ff" stroke="#8250df" stroke-width="1" stroke-dasharray="4 4"/><text x="440" y="116" font-size="14" xml:space="preserve" class="mono" text-anchor="middle">&lt;button<tspan class="accent">●</tspan>&gt;<tspan class="orange">●</tspan>&lt;/button&gt;</text><text x="321" y="150" font-size="12" xml:space="preserve" class="accent">●</text><text x="335" y="150" font-size="11.5" xml:space="preserve" class="muted">the click handler</text><text x="441" y="150" font-size="12" xml:space="preserve" class="orange">●</text><text x="455" y="150" font-size="11.5" xml:space="preserve" class="muted">the text n</text><text x="321" y="168" font-size="11.5" xml:space="preserve" class="muted">holes: the only places that can change</text><line x1="321" y1="184" x2="559" y2="184" stroke="#d0d7de"/><text x="321" y="206" font-size="12.5" xml:space="preserve" class="blue" font-weight="700">the render, generated</text><text x="321" y="232" font-size="11.5" xml:space="preserve" class="mono"><tspan class="accent">if </tspan><tspan class="orange">n</tspan> !== last then</text><text x="321" y="252" font-size="11.5" xml:space="preserve" class="mono">  text.data = <tspan class="orange">n</tspan></text><text x="321" y="280" font-size="11.5" xml:space="preserve" class="muted">one compare per value, at most</text><text x="321" y="298" font-size="11.5" xml:space="preserve" class="muted">one write per change: nothing else</text><rect x="610" y="54" width="270" height="260" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" filter="url(#lift)"/><rect x="626" y="68" width="238" height="44" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.3"/><text x="640" y="87" font-size="12" xml:space="preserve" class="mono" font-weight="700">click → set (fun n -&gt; n + 1)</text><text x="640" y="104" font-size="11" xml:space="preserve" class="muted">your code, as before</text><line x1="745" y1="113" x2="745" y2="126" stroke="#8250df" stroke-width="1.4" marker-end="url(#arrow-accent)"/><rect x="626" y="128" width="238" height="44" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.3"/><text x="640" y="147" font-size="12" xml:space="preserve" class="mono" font-weight="700">only this component runs</text><text x="640" y="164" font-size="11" xml:space="preserve" class="muted">no parent, no tree</text><line x1="745" y1="173" x2="745" y2="186" stroke="#8250df" stroke-width="1.4" marker-end="url(#arrow-accent)"/><rect x="626" y="188" width="238" height="44" rx="10" fill="#f5f0ff" stroke="#8250df" stroke-width="1.3"/><text x="640" y="207" font-size="12" xml:space="preserve" class="mono accent" font-weight="700">n: 0 → 1, so n !== last</text><text x="640" y="224" font-size="11" xml:space="preserve" class="muted">one ===</text><line x1="745" y1="233" x2="745" y2="246" stroke="#8250df" stroke-width="1.4" marker-end="url(#arrow-accent)"/><rect x="626" y="248" width="238" height="44" rx="10" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1.3"/><text x="640" y="267" font-size="12" xml:space="preserve" class="mono green" font-weight="700">text.data = &quot;1&quot;</text><text x="640" y="284" font-size="11" xml:space="preserve" class="muted">the only DOM write</text><line x1="273" y1="184" x2="301" y2="184" stroke="#8250df" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><line x1="578" y1="184" x2="606" y2="184" stroke="#8250df" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="0" y="336" width="430" height="116" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="18" y="362" font-size="14.5" xml:space="preserve" font-weight="700">Gone</text><text x="62" y="362" font-size="12.5" xml:space="preserve" class="muted">from the bundle and from every render</text><rect x="18" y="376" width="62" height="28" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="49.0" y="395" font-size="12" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">React</text><line x1="30" y1="391" x2="68" y2="391" stroke="#bc4c00" stroke-width="1.6"/><rect x="90" y="376" width="92" height="28" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="136.0" y="395" font-size="12" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">react-dom</text><line x1="102" y1="391" x2="170" y2="391" stroke="#bc4c00" stroke-width="1.6"/><rect x="192" y="376" width="107" height="28" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="245.5" y="395" font-size="12" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">virtual DOM</text><line x1="204" y1="391" x2="287" y2="391" stroke="#bc4c00" stroke-width="1.6"/><rect x="18" y="414" width="153" height="28" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="94.5" y="433" font-size="12" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">a tree per render</text><line x1="30" y1="429" x2="159" y2="429" stroke="#bc4c00" stroke-width="1.6"/><rect x="181" y="414" width="92" height="28" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="227.0" y="433" font-size="12" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">tree diff</text><line x1="193" y1="429" x2="261" y2="429" stroke="#bc4c00" stroke-width="1.6"/><rect x="283" y="414" width="62" height="28" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="314.0" y="433" font-size="12" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">fiber</text><line x1="295" y1="429" x2="333" y2="429" stroke="#bc4c00" stroke-width="1.6"/><rect x="450" y="336" width="430" height="116" rx="14" fill="#f5f0ff" stroke="#8250df" stroke-width="1"/><text x="468" y="362" font-size="14.5" xml:space="preserve" font-weight="700">Stays</text><text x="512" y="362" font-size="12.5" xml:space="preserve" class="muted">it compiles unchanged</text><rect x="468" y="376" width="138" height="28" rx="14" fill="#f5f0ff" stroke="#8250df" stroke-width="1.2"/><text x="537.0" y="395" font-size="12" xml:space="preserve" class="accent" font-weight="600" text-anchor="middle">your components</text><rect x="616" y="376" width="62" height="28" rx="14" fill="#f5f0ff" stroke="#8250df" stroke-width="1.2"/><text x="647.0" y="395" font-size="12" xml:space="preserve" class="accent" font-weight="600" text-anchor="middle">hooks</text><rect x="688" y="376" width="176" height="28" rx="14" fill="#f5f0ff" stroke="#8250df" stroke-width="1.2"/><text x="776.0" y="395" font-size="12" xml:space="preserve" class="accent" font-weight="600" text-anchor="middle">mlx · Reason · OCaml</text><rect x="468" y="414" width="84" height="28" rx="14" fill="#f5f0ff" stroke="#8250df" stroke-width="1.2"/><text x="510.0" y="433" font-size="12" xml:space="preserve" class="accent" font-weight="600" text-anchor="middle">ReactDOM</text><rect x="562" y="414" width="107" height="28" rx="14" fill="#f5f0ff" stroke="#8250df" stroke-width="1.2"/><text x="615.5" y="433" font-size="12" xml:space="preserve" class="accent" font-weight="600" text-anchor="middle">React.Event</text><rect x="0" y="468" width="880" height="52" rx="14" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1.4"/><text x="20" y="499" font-size="14" xml:space="preserve" class="green" font-weight="700">Starting fresh?</text><text x="140" y="499" font-size="12.5" xml:space="preserve" class="muted">Write Meltea: messages and a pure update, compiled by the same compiler into the same templates.</text></g></svg>