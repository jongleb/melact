<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 316" width="896" height="316" role="img" aria-label="Server rendering and hydration: on the server Program.render or renderToString writes the HTML with a marker pair around every dynamic part, here the text 41 of the counter, and sends empty texts as empty comments; in the browser hydrate runs the compiled walk over the server&#x27;s nodes: the root with the same tag is taken over instead of cloned, the walk steps over marked ranges, the text is taken over and its markers removed, and the buttons get their handlers; no element is created and lists are taken over from the last row back; HTML that does not match the view is cleared and mounted from scratch"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #59636e; } .faint { fill: #8c959f; }.accent { fill: #8250df; } .green { fill: #1a7f37; }.orange { fill: #bc4c00; } .blue { fill: #0969da; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/></linearGradient></defs><rect x="0" y="0" width="290" height="300" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4" filter="url(#lift)"/><text x="18" y="28" font-size="14" xml:space="preserve" font-weight="700">1 · on the server</text><text x="18" y="47" font-size="11.5" xml:space="preserve" class="muted">Program.render · renderToString</text><text x="18" y="80" font-size="11.5" xml:space="preserve" class="mono">&lt;div class=&quot;counter&quot;&gt;</text><text x="18" y="100" font-size="11.5" xml:space="preserve" class="mono">  &lt;button&gt;-&lt;/button&gt;</text><text x="18" y="120" font-size="11.5" xml:space="preserve" class="mono">  &lt;output class=&quot;&quot;&gt;</text><text x="18" y="140" font-size="11.5" xml:space="preserve" class="mono">    <tspan class="orange">&lt;!--[--&gt;</tspan><tspan class="green">41</tspan><tspan class="orange">&lt;!--]--&gt;</tspan></text><text x="18" y="160" font-size="11.5" xml:space="preserve" class="mono">  &lt;/output&gt;</text><text x="18" y="180" font-size="11.5" xml:space="preserve" class="mono">  &lt;button&gt;+&lt;/button&gt;</text><text x="18" y="200" font-size="11.5" xml:space="preserve" class="mono">  &lt;button&gt;reset&lt;/button&gt;</text><text x="18" y="220" font-size="11.5" xml:space="preserve" class="mono">&lt;/div&gt;</text><text x="18" y="258" font-size="11.5" xml:space="preserve" class="muted">a marker pair around every dynamic part;</text><text x="18" y="276" font-size="11.5" xml:space="preserve" class="muted">an empty text is sent as &lt;!----&gt;</text><line x1="294" y1="150" x2="326" y2="150" stroke="#8250df" stroke-width="1.8" marker-end="url(#arrow-accent)" class="flow"/><rect x="330" y="0" width="290" height="300" rx="14" fill="#f6f8fa" stroke="#8250df" stroke-width="1.4" filter="url(#lift)"/><text x="348" y="28" font-size="14" xml:space="preserve" font-weight="700">2 · in the browser: hydrate</text><text x="348" y="47" font-size="11.5" xml:space="preserve" class="muted">the compiled walk, over the server&#x27;s nodes</text><circle cx="352" cy="74" r="4" fill="#8250df"/><text x="364" y="78" font-size="12" xml:space="preserve" class="mono" font-weight="700">div.counter</text><text x="364" y="96" font-size="11.5" xml:space="preserve" class="muted">same tag: taken over, not cloned</text><circle cx="352" cy="126" r="4" fill="#8250df"/><text x="364" y="130" font-size="12" xml:space="preserve" class="mono" font-weight="700">firstChild / nextSibling</text><text x="364" y="148" font-size="11.5" xml:space="preserve" class="muted">steps over marked ranges, as on a clone</text><circle cx="352" cy="178" r="4" fill="#8250df"/><text x="364" y="182" font-size="12" xml:space="preserve" class="mono green" font-weight="700">41</text><text x="364" y="200" font-size="11.5" xml:space="preserve" class="muted">taken over; both markers removed</text><circle cx="352" cy="230" r="4" fill="#8250df"/><text x="364" y="234" font-size="12" xml:space="preserve" class="mono" font-weight="700">3 × button</text><text x="364" y="252" font-size="11.5" xml:space="preserve" class="muted">handlers set; nothing else is written</text><line x1="624" y1="110" x2="656" y2="110" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#arrow-green)" class="flow"/><rect x="660" y="0" width="220" height="196" rx="14" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1.5" filter="url(#lift)"/><text x="770" y="30" font-size="13.5" xml:space="preserve" class="green" font-weight="700" text-anchor="middle">3 · the same page, live</text><rect x="690" y="48" width="160" height="44" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><rect x="698" y="54" width="30" height="32" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="713" y="76" font-size="15" xml:space="preserve" font-weight="600" text-anchor="middle">−</text><rect x="812" y="54" width="30" height="32" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="827" y="76" font-size="15" xml:space="preserve" font-weight="600" text-anchor="middle">+</text><text x="770" y="77" font-size="18" xml:space="preserve" class="mono green" font-weight="700" text-anchor="middle">41</text><text x="770" y="122" font-size="12" xml:space="preserve" font-weight="600" text-anchor="middle">0 createElement, 0 cloneNode</text><text x="770" y="144" font-size="11.5" xml:space="preserve" class="muted" text-anchor="middle">every node stays the server&#x27;s;</text><text x="770" y="162" font-size="11.5" xml:space="preserve" class="muted" text-anchor="middle">a list is taken over</text><text x="770" y="180" font-size="11.5" xml:space="preserve" class="muted" text-anchor="middle">from its last row back</text><rect x="660" y="212" width="220" height="88" rx="14" fill="#fff4e8" stroke="#bc4c00" stroke-width="1.3"/><text x="678" y="240" font-size="13" xml:space="preserve" class="orange" font-weight="700">HTML that does not match</text><text x="678" y="262" font-size="11.5" xml:space="preserve" class="muted">the view: the root is cleared</text><text x="678" y="280" font-size="11.5" xml:space="preserve" class="muted">and mounted from scratch</text></svg>