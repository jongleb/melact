<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 408" width="896" height="408" role="img" aria-label="Only the component whose state changed renders. Parents are not visited; children with equal props are skipped. A state update in TodoList re-renders TodoList only. The setter marks it dirty, and state set back to its rendered value renders nothing; after a click one microtask flushes, while timers and observers batch into one task, as React&#x27;s lanes do; App and Header are not visited; each Row is kept while each of its inputs is physically equal, and values written inline in its props are cached by what they capture"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #59636e; } .faint { fill: #8c959f; }.accent { fill: #8250df; } .green { fill: #1a7f37; }.orange { fill: #bc4c00; } .blue { fill: #0969da; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">RE-RENDERING</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">Only the component whose state changed renders</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">Parents are not visited; children with equal props are skipped.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><line x1="230" y1="82" x2="110" y2="132" stroke="#d0d7de" stroke-width="1.4"/><line x1="230" y1="82" x2="350" y2="132" stroke="#d0d7de" stroke-width="1.4"/><line x1="350" y1="168" x2="230" y2="222" stroke="#d0d7de" stroke-width="1.4"/><line x1="350" y1="168" x2="350" y2="222" stroke="#d0d7de" stroke-width="1.4"/><line x1="350" y1="168" x2="470" y2="222" stroke="#d0d7de" stroke-width="1.4"/><rect x="180" y="46" width="100" height="36" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="230" y="69" font-size="13" xml:space="preserve" class="faint" font-weight="600" text-anchor="middle">App</text><rect x="60" y="132" width="100" height="36" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="110" y="155" font-size="13" xml:space="preserve" class="faint" font-weight="600" text-anchor="middle">Header</text><rect x="300" y="132" width="100" height="36" rx="10" fill="#f5f0ff" stroke="#8250df" stroke-width="1.6"/><text x="350" y="155" font-size="13" xml:space="preserve" font-weight="600" text-anchor="middle">TodoList</text><rect x="180" y="222" width="100" height="36" rx="10" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1.6" stroke-dasharray="4 3"/><text x="230" y="245" font-size="13" xml:space="preserve" font-weight="600" text-anchor="middle">Row a</text><rect x="300" y="222" width="100" height="36" rx="10" fill="#f5f0ff" stroke="#8250df" stroke-width="1.6"/><text x="350" y="245" font-size="13" xml:space="preserve" font-weight="600" text-anchor="middle">Row b</text><rect x="420" y="222" width="100" height="36" rx="10" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1.6" stroke-dasharray="4 3"/><text x="470" y="245" font-size="13" xml:space="preserve" font-weight="600" text-anchor="middle">Row c</text><circle cx="400" cy="132" r="9" fill="#bc4c00" class="pulse"/><text x="414" y="124" font-size="11.5" xml:space="preserve" class="orange" font-weight="600">setState</text><text x="230" y="288" font-size="11" xml:space="preserve" class="green" text-anchor="middle">inputs === → kept</text><text x="470" y="288" font-size="11" xml:space="preserve" class="green" text-anchor="middle">inputs === → kept</text><text x="350" y="288" font-size="11" xml:space="preserve" class="accent" text-anchor="middle">an input changed</text><circle cx="594" cy="49" r="12" fill="#8250df"/><text x="594" y="54" font-size="12" xml:space="preserve" style="fill:#ffffff" font-weight="700" text-anchor="middle">1</text><text x="616" y="54" font-size="13.5" xml:space="preserve" font-weight="600">The setter marks TodoList dirty</text><text x="616" y="72" font-size="12" xml:space="preserve" class="muted">state set back to where it was: no render</text><circle cx="594" cy="109" r="12" fill="#8250df"/><text x="594" y="114" font-size="12" xml:space="preserve" style="fill:#ffffff" font-weight="700" text-anchor="middle">2</text><text x="616" y="114" font-size="13.5" xml:space="preserve" font-weight="600">A click flushes in one microtask</text><text x="616" y="132" font-size="12" xml:space="preserve" class="muted">timers, observers: one task, as in React</text><circle cx="594" cy="169" r="12" fill="#8250df"/><text x="594" y="174" font-size="12" xml:space="preserve" style="fill:#ffffff" font-weight="700" text-anchor="middle">3</text><text x="616" y="174" font-size="13.5" xml:space="preserve" font-weight="600">TodoList renders again</text><text x="616" y="192" font-size="12" xml:space="preserve" class="muted">App and Header are not visited</text><circle cx="594" cy="229" r="12" fill="#8250df"/><text x="594" y="234" font-size="12" xml:space="preserve" style="fill:#ffffff" font-weight="700" text-anchor="middle">4</text><text x="616" y="234" font-size="13.5" xml:space="preserve" font-weight="600">Each Row with equal props is kept</text><text x="616" y="252" font-size="12" xml:space="preserve" class="muted">inputs one === each; inline props are cached</text></g></svg>