<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 292" width="896" height="292" role="img" aria-label="The compiled refresh of counter-react on a click from 41 to 42: count changed, so the text and disabled holes run and the text node gets 42; tone, initial and the setter are the same, so the class hole is not even evaluated and the three click handlers, which read only the setter and initial, are kept"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><text x="16" y="22" font-size="12" xml:space="preserve" class="muted" font-weight="600">local the view reads</text><text x="220" y="22" font-size="12" xml:space="preserve" class="muted" font-weight="600">render 41 → 42</text><text x="400" y="22" font-size="12" xml:space="preserve" class="muted" font-weight="600">check</text><text x="500" y="22" font-size="12" xml:space="preserve" class="muted" font-weight="600">holes that read it</text><text x="690" y="22" font-size="12" xml:space="preserve" class="muted" font-weight="600">DOM work</text><rect x="0" y="36" width="880" height="44" rx="10" fill="#2b1d12" stroke="#f0883e" stroke-width="1" filter="url(#lift)"/><text x="16" y="63" font-size="13" xml:space="preserve" class="mono" font-weight="700">count</text><rect x="220" y="46" width="140" height="24" rx="6" fill="none" stroke="#30363d" stroke-width="1"/><text x="290" y="63" font-size="12" xml:space="preserve" class="mono" text-anchor="middle">41 → 42</text><text x="400" y="63" font-size="13" xml:space="preserve" class="mono orange" font-weight="700">changed</text><text x="500" y="63" font-size="12" xml:space="preserve" class="muted">text, disabled</text><text x="690" y="63" font-size="12" xml:space="preserve" class="orange" font-weight="600">node.data = &quot;42&quot;</text><rect x="0" y="90" width="880" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="16" y="117" font-size="13" xml:space="preserve" class="mono" font-weight="700">tone</text><rect x="220" y="100" width="140" height="24" rx="6" fill="none" stroke="#30363d" stroke-width="1"/><text x="290" y="117" font-size="12" xml:space="preserve" class="mono" text-anchor="middle">&quot;&quot; → &quot;&quot;</text><text x="400" y="117" font-size="13" xml:space="preserve" class="mono green" font-weight="700">same</text><text x="500" y="117" font-size="12" xml:space="preserve" class="muted">class</text><text x="690" y="117" font-size="12" xml:space="preserve" class="green">class not even evaluated</text><rect x="0" y="144" width="880" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="16" y="171" font-size="13" xml:space="preserve" class="mono" font-weight="700">initial</text><rect x="220" y="154" width="140" height="24" rx="6" fill="none" stroke="#30363d" stroke-width="1"/><text x="290" y="171" font-size="12" xml:space="preserve" class="mono" text-anchor="middle">0 → 0</text><text x="400" y="171" font-size="13" xml:space="preserve" class="mono green" font-weight="700">same</text><text x="500" y="171" font-size="12" xml:space="preserve" class="muted">disabled (with count)</text><text x="690" y="171" font-size="12" xml:space="preserve" class="green">evaluated, still false: no write</text><rect x="0" y="198" width="880" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="16" y="225" font-size="13" xml:space="preserve" class="mono" font-weight="700">setCount</text><rect x="220" y="208" width="140" height="24" rx="6" fill="none" stroke="#30363d" stroke-width="1"/><text x="290" y="225" font-size="12" xml:space="preserve" class="mono" text-anchor="middle">stable</text><text x="400" y="225" font-size="13" xml:space="preserve" class="mono green" font-weight="700">same</text><text x="500" y="225" font-size="12" xml:space="preserve" class="muted">3 × onClick</text><text x="690" y="225" font-size="12" xml:space="preserve" class="green">handlers kept, none rebuilt</text><text x="0" y="268" font-size="12" xml:space="preserve" class="muted">One click in counter-react: four === on locals, then only the holes that read the changed one run, handlers included.</text></svg>