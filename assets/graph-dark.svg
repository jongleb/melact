<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 398" width="896" height="398" role="img" aria-label="A render runs only the steps a change reaches. Sources are bits; every let, effect and the view get the bits they read, at build time. The update graph of a row: melact-ppx numbers its sources, the props item and bulk, the context theme and the state cell fold, and gives every step of the body the bits it reads. When setFold changes fold, the row renders with that bit alone: useState is called as on every render, the context read and the label keep their values, the effect on bulk.generation is passed over without evaluating its dependencies, and the view, which reads fold, is refreshed; had no bit of the view changed, its holes would not be touched"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">THE UPDATE GRAPH</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">A render runs only the steps a change reaches</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">Sources are bits; every let, effect and the view get the bits they read, at build time.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><text x="330" y="44" font-size="11.5" xml:space="preserve" class="blue" font-weight="600" text-anchor="middle">item</text><text x="376" y="44" font-size="11.5" xml:space="preserve" class="orange" font-weight="600" text-anchor="middle">bulk</text><text x="422" y="44" font-size="11.5" xml:space="preserve" class="accent" font-weight="600" text-anchor="middle">theme</text><text x="468" y="44" font-size="11.5" xml:space="preserve" class="green" font-weight="600" text-anchor="middle">fold</text><circle cx="468" cy="24" r="8" fill="#3fb950" class="pulse"/><text x="482" y="28" font-size="11.5" xml:space="preserve" class="green" font-weight="600">setFold</text><rect x="20" y="64" width="520" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="34" y="86" font-size="12.5" xml:space="preserve" class="mono muted">let theme = useContext ctx</text><circle cx="330" cy="81" r="6" fill="none" stroke="#30363d" stroke-width="1.4"/><circle cx="376" cy="81" r="6" fill="none" stroke="#30363d" stroke-width="1.4"/><circle cx="422" cy="81" r="6" fill="#b58cff" stroke="#b58cff" stroke-width="1.4"/><circle cx="468" cy="81" r="6" fill="none" stroke="#30363d" stroke-width="1.4"/><text x="528" y="86" font-size="11.5" xml:space="preserve" class="faint" font-weight="600" text-anchor="end">kept</text><rect x="20" y="108" width="520" height="34" rx="8" fill="#12261a" stroke="#3fb950" stroke-width="1.6"/><text x="34" y="130" font-size="12.5" xml:space="preserve" class="mono">let fold, setFold = useState …</text><circle cx="330" cy="125" r="6" fill="none" stroke="#30363d" stroke-width="1.4"/><circle cx="376" cy="125" r="6" fill="none" stroke="#30363d" stroke-width="1.4"/><circle cx="422" cy="125" r="6" fill="none" stroke="#30363d" stroke-width="1.4"/><circle cx="468" cy="125" r="6" fill="#3fb950" stroke="#3fb950" stroke-width="1.4"/><text x="528" y="130" font-size="11.5" xml:space="preserve" class="green" font-weight="600" text-anchor="end">called</text><rect x="20" y="152" width="520" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="34" y="174" font-size="12.5" xml:space="preserve" class="mono muted">useEffect1 … [| bulk.generation |]</text><circle cx="330" cy="169" r="6" fill="none" stroke="#30363d" stroke-width="1.4"/><circle cx="376" cy="169" r="6" fill="#f0883e" stroke="#f0883e" stroke-width="1.4"/><circle cx="422" cy="169" r="6" fill="none" stroke="#30363d" stroke-width="1.4"/><circle cx="468" cy="169" r="6" fill="none" stroke="#30363d" stroke-width="1.4"/><text x="528" y="174" font-size="11.5" xml:space="preserve" class="faint" font-weight="600" text-anchor="end">skipped</text><rect x="20" y="196" width="520" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="34" y="218" font-size="12.5" xml:space="preserve" class="mono muted">let label = cx [item.kind; theme]</text><circle cx="330" cy="213" r="6" fill="#58a6ff" stroke="#58a6ff" stroke-width="1.4"/><circle cx="376" cy="213" r="6" fill="none" stroke="#30363d" stroke-width="1.4"/><circle cx="422" cy="213" r="6" fill="#b58cff" stroke="#b58cff" stroke-width="1.4"/><circle cx="468" cy="213" r="6" fill="none" stroke="#30363d" stroke-width="1.4"/><text x="528" y="218" font-size="11.5" xml:space="preserve" class="faint" font-weight="600" text-anchor="end">kept</text><rect x="20" y="240" width="520" height="34" rx="8" fill="#12261a" stroke="#3fb950" stroke-width="1.6"/><text x="34" y="262" font-size="12.5" xml:space="preserve" class="mono">&lt;li className=(label … fold) …&gt;</text><circle cx="330" cy="257" r="6" fill="#58a6ff" stroke="#58a6ff" stroke-width="1.4"/><circle cx="376" cy="257" r="6" fill="none" stroke="#30363d" stroke-width="1.4"/><circle cx="422" cy="257" r="6" fill="#b58cff" stroke="#b58cff" stroke-width="1.4"/><circle cx="468" cy="257" r="6" fill="#3fb950" stroke="#3fb950" stroke-width="1.4"/><text x="528" y="262" font-size="11.5" xml:space="preserve" class="green" font-weight="600" text-anchor="end">runs</text><circle cx="584" cy="69" r="12" fill="#b58cff"/><text x="584" y="74" font-size="12" xml:space="preserve" style="fill:#ffffff" font-weight="700" text-anchor="middle">1</text><text x="606" y="74" font-size="13.5" xml:space="preserve" font-weight="600">Sources are bits</text><text x="606" y="92" font-size="12" xml:space="preserve" class="muted">inputs, hook slots, context reads</text><circle cx="584" cy="121" r="12" fill="#b58cff"/><text x="584" y="126" font-size="12" xml:space="preserve" style="fill:#ffffff" font-weight="700" text-anchor="middle">2</text><text x="606" y="126" font-size="13.5" xml:space="preserve" font-weight="600">Each step gets a mask</text><text x="606" y="144" font-size="12" xml:space="preserve" class="muted">the bits it reads, through its lets</text><circle cx="584" cy="173" r="12" fill="#b58cff"/><text x="584" y="178" font-size="12" xml:space="preserve" style="fill:#ffffff" font-weight="700" text-anchor="middle">3</text><text x="606" y="178" font-size="13.5" xml:space="preserve" font-weight="600">setFold flips one bit</text><text x="606" y="196" font-size="12" xml:space="preserve" class="muted">the instance renders with it alone</text><circle cx="584" cy="225" r="12" fill="#b58cff"/><text x="584" y="230" font-size="12" xml:space="preserve" style="fill:#ffffff" font-weight="700" text-anchor="middle">4</text><text x="606" y="230" font-size="13.5" xml:space="preserve" font-weight="600">Only matching steps run</text><text x="606" y="248" font-size="12" xml:space="preserve" class="muted">a view that reads no changed bit: untouched</text></g></svg>