<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-label="Two front ends, one compiler, one runtime: Meltea views in mlx with messages go through meltea-ppx, Melact components in reason-react style go through melact-ppx; both reach the shared compiler that turns static markup into templates and dynamic parts into holes, and the shared runtime that clones templates, writes changed holes, moves keyed rows and delegates events; Melact alone adds hook slots and an update scheduler"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><text x="0" y="18" font-size="12.5" xml:space="preserve" class="muted" font-weight="600">two front ends, one compiler, one runtime</text><rect x="0" y="30" width="410" height="150" rx="14" fill="#161b22" stroke="#b58cff" stroke-width="1.6" filter="url(#lift)"/><text x="18" y="56" font-size="15" xml:space="preserve" class="accent" font-weight="800">Meltea</text><text x="80" y="56" font-size="12" xml:space="preserve" class="muted">the Elm architecture, pure functions</text><text x="18" y="84" font-size="11.5" xml:space="preserve" class="mono">let view count =</text><text x="18" y="104" font-size="11.5" xml:space="preserve" class="mono">  &lt;button onClick=<tspan class="accent">Increment</tspan>&gt;</text><text x="18" y="124" font-size="11.5" xml:space="preserve" class="mono">    (Html.int count)</text><text x="18" y="144" font-size="11.5" xml:space="preserve" class="mono">  &lt;/button&gt;</text><rect x="470" y="30" width="410" height="150" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="1.6" filter="url(#lift)"/><text x="488" y="56" font-size="15" xml:space="preserve" class="blue" font-weight="800">Melact</text><text x="550" y="56" font-size="12" xml:space="preserve" class="muted">pretends to be React</text><text x="488" y="84" font-size="11.5" xml:space="preserve" class="mono">let[@react.component] make () =</text><text x="488" y="104" font-size="11.5" xml:space="preserve" class="mono">  let n, set = <tspan class="blue">React.useState</tspan> … in</text><text x="488" y="124" font-size="11.5" xml:space="preserve" class="mono">  &lt;button onClick=(fun _ -&gt; set …)&gt;</text><text x="488" y="144" font-size="11.5" xml:space="preserve" class="mono">    (React.int n)&lt;/button&gt;</text><line x1="205" y1="182" x2="205" y2="202" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="105" y="206" width="200" height="30" rx="15" fill="#221a38" stroke="#b58cff" stroke-width="1.4"/><text x="205" y="226" font-size="12.5" xml:space="preserve" class="mono accent" font-weight="700" text-anchor="middle">meltea-ppx</text><text x="205" y="254" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">messages, no hooks, no components</text><line x1="675" y1="182" x2="675" y2="202" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrow-blue)" class="flow"/><rect x="575" y="206" width="200" height="30" rx="15" fill="#0f2136" stroke="#58a6ff" stroke-width="1.4"/><text x="675" y="226" font-size="12.5" xml:space="preserve" class="mono blue" font-weight="700" text-anchor="middle">melact-ppx</text><text x="675" y="254" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">[@react.component], hook keys</text><path d="M205,262 C205,286 330,282 330,300" fill="none" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><path d="M675,262 C675,286 550,282 550,300" fill="none" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrow-blue)" class="flow"/><rect x="200" y="304" width="480" height="62" rx="14" fill="#161b22" stroke="#e6edf3" stroke-width="1.6" filter="url(#lift)"/><rect x="200" y="304" width="480" height="5" rx="2.5" fill="url(#glow)"/><text x="440" y="330" font-size="14.5" xml:space="preserve" font-weight="800" text-anchor="middle">the shared compiler</text><text x="440" y="352" font-size="11.5" xml:space="preserve" class="muted" text-anchor="middle">static markup → template · dynamic parts → holes with paths · DOM props table</text><line x1="440" y1="368" x2="440" y2="392" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow-muted)" class="flow"/><rect x="110" y="396" width="520" height="50" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#lift)"/><text x="370" y="418" font-size="13.5" xml:space="preserve" font-weight="700" text-anchor="middle">shared runtime</text><text x="370" y="436" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">clone a template · write changed holes · keyed moves · delegated events</text><rect x="642" y="396" width="238" height="50" rx="14" fill="#0f2136" stroke="#58a6ff" stroke-width="1"/><text x="761" y="418" font-size="13" xml:space="preserve" class="blue" font-weight="700" text-anchor="middle">Melact only</text><text x="761" y="436" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">hook slots · update scheduler</text></svg>