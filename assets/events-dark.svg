<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" width="880" height="296" role="img" aria-label="One listener per event type on the document; on a click melact walks from the target up through parent nodes and calls the handler stored on each element; replacing a handler is one property write"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><rect x="150" y="38" width="120" height="32" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="210" y="59" font-size="13" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">document</text><text x="370" y="59" font-size="11.5" xml:space="preserve" class="muted">1 listener per event type</text><rect x="150" y="86" width="120" height="32" rx="8" fill="#221a38" stroke="#b58cff" stroke-width="1.4"/><text x="210" y="107" font-size="13" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">div</text><text x="370" y="107" font-size="11.5" xml:space="preserve" class="mono accent">$$melhole:click = outer</text><rect x="150" y="134" width="120" height="32" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="210" y="155" font-size="13" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">ul</text><rect x="150" y="182" width="120" height="32" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="210" y="203" font-size="13" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">li</text><rect x="150" y="230" width="120" height="32" rx="8" fill="#221a38" stroke="#b58cff" stroke-width="1.4"/><text x="210" y="251" font-size="13" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">button</text><text x="370" y="251" font-size="11.5" xml:space="preserve" class="mono accent">$$melhole:click = inner</text><path d="M146,236 C96,200 96,80 146,48" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow-muted)" class="flow"/><text x="18" y="146" font-size="11.5" xml:space="preserve" class="muted">native</text><text x="18" y="162" font-size="11.5" xml:space="preserve" class="muted">bubbling</text><path d="M274,240 C336,200 336,130 274,96" fill="none" stroke="#b58cff" stroke-width="2" marker-end="url(#arrow-accent)" class="flow"/><text x="326" y="172" font-size="11.5" xml:space="preserve" class="accent" font-weight="600">walk</text><circle cx="152" cy="246" r="6" fill="#f0883e" class="pulse"/><text x="118" y="276" font-size="11.5" xml:space="preserve" class="orange" font-weight="600">click</text><text x="150" y="26" font-size="12" xml:space="preserve" class="muted">Melact walks from the target up, calling each $$melhole:click; stopPropagation ends the walk</text><rect x="560" y="40" width="320" height="236" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="580" y="68" font-size="14" xml:space="preserve" font-weight="600">Replacing a handler</text><text x="580" y="92" font-size="12" xml:space="preserve" class="mono accent">el[&quot;$$melhole:click&quot;] = next</text><text x="580" y="114" font-size="12" xml:space="preserve" class="muted">0 addEventListener, 0 setAttribute</text><text x="580" y="150" font-size="14" xml:space="preserve" font-weight="600">Non-bubbling events</text><text x="580" y="174" font-size="12" xml:space="preserve" class="muted">scroll, focus, load …</text><text x="580" y="196" font-size="12" xml:space="preserve" class="muted">one listener on the element,</text><text x="580" y="214" font-size="12" xml:space="preserve" class="muted">removed on unmount</text><text x="580" y="250" font-size="12" xml:space="preserve" class="muted">Delegated: click, input, keydown,</text><text x="580" y="268" font-size="12" xml:space="preserve" class="muted">pointer*, mouse*, touch* … 22 types</text></svg>