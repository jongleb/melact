<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 404" width="896" height="404" role="img" aria-label="One screen at a time, hooks out, nothing rewritten at once. A Meltea program runs inside a Melact app, and a Melact widget inside a Meltea view, on one runtime. Moving one screen at a time: a Melact shell with hooks renders MelteaProgram with a program, an input and onReport; the Meltea screen in the middle has init of the input, a pure update of message and model, and a view; a new input becomes the message receive input, drawn in the same render, and each message the program sends itself is offered to report message model and then to the latest onReport. Inside its view, MelactHtml.element shows a Melact leaf widget that still has hooks, with props from the model; the widget&#x27;s callbacks send messages, and its effects run after the program&#x27;s draw. Both sides share one melhole: one listener per event type on document, and the screen draws in Melact&#x27;s own flush; unmounting either side stops subscriptions, drops late commands and runs the widget&#x27;s cleanups"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">MOVING TO MELTEA</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">One screen at a time, hooks out, nothing rewritten at once</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">A Meltea program runs inside a Melact app, and a Melact widget inside a Meltea view, on one runtime.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><rect x="0" y="0" width="250" height="178" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="1.6" filter="url(#lift)"/><text x="16" y="30" font-size="14.5" xml:space="preserve" class="blue" font-weight="800">Melact shell</text><text x="16" y="50" font-size="11.5" xml:space="preserve" class="muted">hooks, as before</text><text x="16" y="80" font-size="11.2" xml:space="preserve" class="mono">let filter, setFilter =</text><text x="16" y="99" font-size="11.2" xml:space="preserve" class="mono">  <tspan class="blue">React.useState</tspan> … in</text><text x="16" y="118" font-size="11.2" xml:space="preserve" class="mono">&lt;<tspan class="accent">MelteaProgram</tspan> program=todos</text><text x="16" y="137" font-size="11.2" xml:space="preserve" class="mono">  input=filter</text><text x="16" y="156" font-size="11.2" xml:space="preserve" class="mono">  onReport=(fun n -&gt; …) /&gt;</text><rect x="315" y="0" width="250" height="178" rx="14" fill="#161b22" stroke="#b58cff" stroke-width="1.6" filter="url(#lift)"/><text x="331" y="30" font-size="14.5" xml:space="preserve" class="accent" font-weight="800">Meltea screen</text><text x="331" y="50" font-size="11.5" xml:space="preserve" class="muted">model, messages, pure update</text><text x="331" y="80" font-size="11.2" xml:space="preserve" class="mono">init input</text><text x="331" y="99" font-size="11.2" xml:space="preserve" class="mono">update <tspan class="accent">message</tspan> model</text><text x="331" y="118" font-size="11.2" xml:space="preserve" class="mono">view model =</text><text x="331" y="137" font-size="11.2" xml:space="preserve" class="mono">  &lt;li&gt;(<tspan class="blue">MelactHtml.element</tspan></text><text x="331" y="156" font-size="11.2" xml:space="preserve" class="mono">    (fun send -&gt; &lt;Stars …/&gt;))</text><rect x="630" y="0" width="250" height="178" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="1.6" filter="url(#lift)"/><text x="646" y="30" font-size="14.5" xml:space="preserve" class="blue" font-weight="800">Melact leaf</text><text x="646" y="50" font-size="11.5" xml:space="preserve" class="muted">not moved yet: still hooks</text><text x="646" y="80" font-size="11.2" xml:space="preserve" class="mono">let hover, setHover =</text><text x="646" y="99" font-size="11.2" xml:space="preserve" class="mono">  <tspan class="blue">React.useState</tspan> … in</text><text x="646" y="118" font-size="11.2" xml:space="preserve" class="mono">&lt;span&gt;</text><text x="646" y="137" font-size="11.2" xml:space="preserve" class="mono">  &lt;button onClick=(fun _ -&gt;</text><text x="646" y="156" font-size="11.2" xml:space="preserve" class="mono">    onRate value)&gt; …</text><line x1="254" y1="62" x2="311" y2="62" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arrow-blue)" class="flow"/><text x="282" y="50" font-size="11" xml:space="preserve" class="mono blue" font-weight="700" text-anchor="middle">input</text><line x1="311" y1="134" x2="254" y2="134" stroke="#b58cff" stroke-width="1.8" marker-end="url(#arrow-accent)" class="flow"/><text x="282" y="154" font-size="11" xml:space="preserve" class="mono accent" font-weight="700" text-anchor="middle">report</text><line x1="569" y1="62" x2="626" y2="62" stroke="#b58cff" stroke-width="1.8" marker-end="url(#arrow-accent)" class="flow"/><text x="597" y="50" font-size="11" xml:space="preserve" class="mono accent" font-weight="700" text-anchor="middle">props</text><line x1="626" y1="134" x2="569" y2="134" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arrow-blue)" class="flow"/><text x="597" y="154" font-size="11" xml:space="preserve" class="mono blue" font-weight="700" text-anchor="middle">send</text><text x="125" y="202" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">a new input: receive input,</text><text x="125" y="218" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">drawn in the same render</text><text x="440" y="202" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">reports: report message model,</text><text x="440" y="218" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">then the latest onReport</text><text x="755" y="202" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">callbacks send messages; effects</text><text x="755" y="218" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">run after the program&#x27;s draw</text><rect x="0" y="236" width="880" height="58" rx="14" fill="#12261a" stroke="#3fb950" stroke-width="1.4"/><text x="440" y="260" font-size="12.5" xml:space="preserve" class="green" font-weight="700" text-anchor="middle">one melhole for both: one listener per event type on document; the screen draws in Melact&#x27;s own flush</text><text x="440" y="280" font-size="11.5" xml:space="preserve" class="muted" text-anchor="middle">unmounting either side stops subscriptions, drops late commands and runs the widget&#x27;s cleanups</text></g></svg>