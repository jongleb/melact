ht="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="470" y="74" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">f</text><rect x="44" y="196" width="52" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="70" y="218" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">a</text><rect x="124" y="196" width="52" height="34" rx="8" fill="#221a38" stroke="#b58cff" stroke-width="1.4"/><text x="150" y="218" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">e</text><rect x="204" y="196" width="52" height="34" rx="8" fill="#12261a" stroke="#3fb950" stroke-width="1.4"/><text x="230" y="218" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">c</text><rect x="284" y="196" width="52" height="34" rx="8" fill="#12261a" stroke="#3fb950" stroke-width="1.4"/><text x="310" y="218" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">d</text><rect x="364" y="196" width="52" height="34" rx="8" fill="#221a38" stroke="#b58cff" stroke-width="1.4"/><text x="390" y="218" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">b</text><rect x="444" y="196" width="52" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="470" y="218" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">f</text><rect x="0" y="248" width="14" height="10" rx="3" fill="#9198a1"/><text x="22" y="258" font-size="12" xml:space="preserve" class="muted">common prefix and suffix: patched in place</text><rect x="0" y="268" width="14" height="10" rx="3" fill="#3fb950"/><text x="22" y="278" font-size="12" xml:space="preserve" class="muted">longest increasing run of old positions: stays</text><rect x="0" y="288" width="14" height="10" rx="3" fill="#b58cff"/><text x="22" y="298" font-size="12" xml:space="preserve" class="muted">everything else: one insertBefore each</text><rect x="540" y="24" width="340" height="300" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="560" y="52" font-size="12.5" xml:space="preserve" class="muted" font-weight="600">Measured in test/view (jsdom), 1,000 rows</text><text x="560" y="92" font-size="13" xml:space="preserve">swap rows 1 and 998</text><text x="860" y="92" font-size="13" xml:space="preserve" class="accent" font-weight="700" text-anchor="end">2 moves</text><line x1="560" y1="107" x2="860" y2="107" stroke="#30363d"/><text x="560" y="130" font-size="13" xml:space="preserve">reverse all</text><text x="860" y="130" font-size="13" xml:space="preserve" class="accent" font-weight="700" text-anchor="end">999 moves</text><line x1="560" y1="145" x2="860" y2="145" stroke="#30363d"/><text x="560" y="168" font-size="13" xml:space="preserve">remove one row</text><text x="860" y="168" font-size="13" xml:space="preserve" class="accent" font-weight="700" text-anchor="end">999 rows kept</text><line x1="560" y1="183" x2="860" y2="183" stroke="#30363d"/><text x="560" y="206" font-size="13" xml:space="preserve">append 1,000</text><text x="860" y="206" font-size="13" xml:space="preserve" class="accent" font-weight="700" text-anchor="end">1,000 kept</text><line x1="560" y1="221" x2="860" y2="221" stroke="#30363d"/><text x="560" y="244" font-size="13" xml:space="preserve">update every 10th</text><text x="860" y="244" font-size="13" xml:space="preserve" class="accent" font-weight="700" text-anchor="end">every node kept</text><line x1="560" y1="259" x2="860" y2="259" stroke="#30363d"/><text x="560" y="282" font-size="13" xml:space="preserve">replace all keys</text><text x="860" y="282" font-size="13" xml:space="preserve" class="accent" font-weight="700" text-anchor="end">1,000 new</text></svg>