<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="mlx JSX is compiled by melact-ppx into a template hoisted to module level, with three holes; each render builds only an array of three hole values; the template is cloned once per mount and the hole array patches the clone"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #59636e; } .faint { fill: #8c959f; }.accent { fill: #8250df; } .green { fill: #1a7f37; }.orange { fill: #bc4c00; } .blue { fill: #0969da; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker></defs><text x="2" y="22" font-size="14" xml:space="preserve" font-weight="600">1 · You write JSX in mlx</text><text x="292" y="22" font-size="14" xml:space="preserve" font-weight="600">2 · melact-ppx hoists a template</text><text x="652" y="22" font-size="14" xml:space="preserve" font-weight="600">3 · The DOM</text><rect x="0" y="40" width="230" height="236" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="14" y="74" font-size="12" xml:space="preserve" class="mono">&lt;div className=&quot;counter&quot;&gt;</text><text x="14" y="96" font-size="12" xml:space="preserve" class="mono">  &lt;button onClick=<tspan class="accent">dec</tspan>&gt;</text><text x="14" y="118" font-size="12" xml:space="preserve" class="mono">    (React.string &quot;-&quot;)</text><text x="14" y="140" font-size="12" xml:space="preserve" class="mono">  &lt;/button&gt;</text><text x="14" y="162" font-size="12" xml:space="preserve" class="mono">  &lt;output className=<tspan class="accent">tone</tspan>&gt;</text><text x="14" y="184" font-size="12" xml:space="preserve" class="mono">    <tspan class="accent">(React.int count)</tspan></text><text x="14" y="206" font-size="12" xml:space="preserve" class="mono">  &lt;/output&gt;</text><text x="14" y="228" font-size="12" xml:space="preserve" class="mono">&lt;/div&gt;</text><text x="14" y="262" font-size="11.5" xml:space="preserve" class="muted">purple: dynamic, everything else static</text><rect x="290" y="40" width="300" height="118" rx="12" fill="#f5f0ff" stroke="#8250df" stroke-width="1" stroke-dasharray="4 4"/><text x="306" y="62" font-size="11.5" xml:space="preserve" class="accent" font-weight="600">once, at module level</text><text x="306" y="84" font-size="12" xml:space="preserve" class="mono">&lt;div class=&quot;counter&quot;&gt;</text><text x="306" y="102" font-size="12" xml:space="preserve" class="mono"> &lt;button&gt;-&lt;/button&gt;</text><text x="306" y="120" font-size="12" xml:space="preserve" class="mono"> &lt;output<tspan class="accent"> ●</tspan>&gt;<tspan class="accent">●</tspan>&lt;/output&gt;</text><text x="306" y="138" font-size="12" xml:space="preserve" class="mono">&lt;/div&gt;</text><text x="486" y="84" font-size="11.5" xml:space="preserve" class="muted">holes</text><text x="486" y="102" font-size="10.5" xml:space="preserve" class="mono accent">Handler [0]</text><text x="486" y="118" font-size="10.5" xml:space="preserve" class="mono accent">Attr [1] class</text><text x="486" y="134" font-size="10.5" xml:space="preserve" class="mono accent">Text [1] @0</text><rect x="290" y="172" width="300" height="104" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="306" y="194" font-size="11.5" xml:space="preserve" class="blue" font-weight="600">every render: one array</text><text x="306" y="216" font-size="12" xml:space="preserve" class="mono">[| HHandler dec;</text><text x="306" y="234" font-size="12" xml:space="preserve" class="mono">   HAttr (Some tone);</text><text x="306" y="252" font-size="12" xml:space="preserve" class="mono">   HText &quot;42&quot; |]</text><text x="470" y="234" font-size="11.5" xml:space="preserve" class="muted">no tags,</text><text x="470" y="250" font-size="11.5" xml:space="preserve" class="muted">no attributes</text><rect x="650" y="40" width="230" height="236" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="664" y="76" font-size="12.5" xml:space="preserve" class="mono">div.counter</text><text x="680" y="106" font-size="12.5" xml:space="preserve" class="mono">button</text><rect x="774" y="92" width="96" height="20" rx="10" fill="#f5f0ff" stroke="#8250df" stroke-width="1"/><text x="822" y="106" font-size="10.5" xml:space="preserve" class="accent" text-anchor="middle">click → dec</text><text x="696" y="130" font-size="12.5" xml:space="preserve" class="mono">&quot;-&quot;</text><text x="680" y="166" font-size="12.5" xml:space="preserve" class="mono">output</text><rect x="774" y="152" width="96" height="20" rx="10" fill="#f5f0ff" stroke="#8250df" stroke-width="1"/><text x="822" y="166" font-size="10.5" xml:space="preserve" class="accent" text-anchor="middle">class=&quot;warm&quot;</text><text x="696" y="196" font-size="12.5" xml:space="preserve" class="mono">&quot;42&quot;</text><rect x="774" y="182" width="96" height="20" rx="10" fill="#f5f0ff" stroke="#8250df" stroke-width="1"/><text x="822" y="196" font-size="10.5" xml:space="preserve" class="accent" text-anchor="middle">text node</text><path d="M670,82 V166 M670,106 H676 M670,166 H676 M686,112 V130 M686,130 H692 M686,172 V196 M686,196 H692" fill="none" stroke="#d0d7de" stroke-width="1.4"/><text x="664" y="236" font-size="11.5" xml:space="preserve" class="muted">3 holes bound by path,</text><text x="664" y="254" font-size="11.5" xml:space="preserve" class="muted">the rest is never touched</text><line x1="234" y1="140" x2="284" y2="140" stroke="#8250df" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><text x="259" y="124" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">ppx</text><line x1="594" y1="98" x2="644" y2="98" stroke="#8250df" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><text x="619" y="84" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">clone</text><line x1="594" y1="224" x2="644" y2="224" stroke="#0969da" stroke-width="1.6" marker-end="url(#arrow-blue)" class="flow"/><text x="619" y="210" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">patch</text></svg>