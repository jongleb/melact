<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" role="img" aria-label="melact in one picture: a reason-react component in mlx switches two dune lines; melact-ppx splits its JSX into a template parsed once and a hole array built per render; in the browser a setState re-renders only that component, compares each hole with === and writes only what changed. Gone: React, react-dom, the virtual DOM, the element tree per render, the tree diff, fiber. Stays: your components, hooks, JSX, ReactDOM.Client, ReactEvent"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker></defs><circle cx="11" cy="19" r="11" fill="#b58cff"/><text x="11" y="24" font-size="12" xml:space="preserve" style="fill:#ffffff" font-weight="700" text-anchor="middle">1</text><text x="30" y="24" font-size="14.5" xml:space="preserve" font-weight="600">Your reason-react app</text><circle cx="316" cy="19" r="11" fill="#b58cff"/><text x="316" y="24" font-size="12" xml:space="preserve" style="fill:#ffffff" font-weight="700" text-anchor="middle">2</text><text x="335" y="24" font-size="14.5" xml:space="preserve" font-weight="600">melact-ppx, at build time</text><circle cx="621" cy="19" r="11" fill="#b58cff"/><text x="621" y="24" font-size="12" xml:space="preserve" style="fill:#ffffff" font-weight="700" text-anchor="middle">3</text><text x="640" y="24" font-size="14.5" xml:space="preserve" font-weight="600">In the browser</text><rect x="0" y="40" width="270" height="158" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="12" y="68" font-size="11.2" xml:space="preserve" class="mono">let[@react.component] make () =</text><text x="12" y="87" font-size="11.2" xml:space="preserve" class="mono">  let n, set =</text><text x="12" y="106" font-size="11.2" xml:space="preserve" class="mono">    React.useState (fun () -&gt; 0) in</text><text x="12" y="125" font-size="11.2" xml:space="preserve" class="mono">  &lt;button onClick=<tspan class="accent">(fun _ -&gt;</tspan></text><text x="12" y="144" font-size="11.2" xml:space="preserve" class="mono"><tspan class="accent">      set (fun n -&gt; n + 1))</tspan>&gt;</text><text x="12" y="163" font-size="11.2" xml:space="preserve" class="mono">    <tspan class="accent">(React.int n)</tspan></text><text x="12" y="182" font-size="11.2" xml:space="preserve" class="mono">  &lt;/button&gt;</text><rect x="0" y="208" width="270" height="92" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="12" y="228" font-size="11.5" xml:space="preserve" class="muted" font-weight="600">dune: the whole migration</text><text x="12" y="248" font-size="11.2" xml:space="preserve" class="mono orange">- (libraries reason-react)</text><text x="12" y="263" font-size="11.2" xml:space="preserve" class="mono green">+ (libraries melact)</text><text x="12" y="278" font-size="11.2" xml:space="preserve" class="mono orange">- (pps reason-react-ppx)</text><text x="12" y="293" font-size="11.2" xml:space="preserve" class="mono green">+ (pps melact-ppx)</text><rect x="305" y="40" width="270" height="120" rx="12" fill="#221a38" stroke="#b58cff" stroke-width="1" stroke-dasharray="4 4"/><text x="321" y="62" font-size="12" xml:space="preserve" class="accent" font-weight="700">template · parsed once</text><text x="321" y="92" font-size="13" xml:space="preserve" class="mono">&lt;button&gt;<tspan class="accent">●</tspan>&lt;/button&gt;</text><text x="321" y="118" font-size="12" xml:space="preserve" class="muted">static markup: cloned per mount,</text><text x="321" y="136" font-size="12" xml:space="preserve" class="muted">never rebuilt, never compared</text><text x="321" y="152" font-size="10.5" xml:space="preserve" class="mono faint">+ hole paths: Handler [] · Text [] @0</text><rect x="305" y="172" width="270" height="128" rx="12" fill="#0f2136" stroke="#58a6ff" stroke-width="1"/><text x="321" y="194" font-size="12" xml:space="preserve" class="blue" font-weight="700">holes · all a render builds</text><rect x="321" y="208" width="238" height="26" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="333" y="226" font-size="12" xml:space="preserve" class="mono blue" font-weight="600">HHandler</text><text x="549" y="226" font-size="12" xml:space="preserve" class="mono" text-anchor="end">fun _ -&gt; …</text><rect x="321" y="242" width="238" height="26" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="333" y="260" font-size="12" xml:space="preserve" class="mono blue" font-weight="600">HText</text><text x="549" y="260" font-size="12" xml:space="preserve" class="mono" text-anchor="end">&quot;1&quot;</text><text x="321" y="290" font-size="12" xml:space="preserve" class="muted">one array per element, any size</text><rect x="610" y="40" width="270" height="260" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="626" y="56" width="238" height="40" rx="10" fill="#2b1d12" stroke="#f0883e" stroke-width="1.4"/><text x="745" y="81" font-size="13" xml:space="preserve" font-weight="600" text-anchor="middle">setState</text><line x1="745" y1="98" x2="745" y2="113" stroke="#b58cff" stroke-width="1.4" marker-end="url(#arrow-accent)"/><rect x="626" y="117" width="238" height="40" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="745" y="142" font-size="13" xml:space="preserve" font-weight="600" text-anchor="middle">only this component renders</text><line x1="745" y1="159" x2="745" y2="174" stroke="#b58cff" stroke-width="1.4" marker-end="url(#arrow-accent)"/><rect x="626" y="178" width="238" height="40" rx="10" fill="#221a38" stroke="#b58cff" stroke-width="1.4"/><text x="745" y="203" font-size="13" xml:space="preserve" class="mono accent" font-weight="600" text-anchor="middle">=== on each hole</text><line x1="745" y1="220" x2="745" y2="235" stroke="#b58cff" stroke-width="1.4" marker-end="url(#arrow-accent)"/><rect x="626" y="239" width="238" height="40" rx="10" fill="#12261a" stroke="#3fb950" stroke-width="1.4"/><text x="745" y="264" font-size="13" xml:space="preserve" class="mono green" font-weight="600" text-anchor="middle">text.data = &quot;1&quot;</text><text x="745" y="296" font-size="11" xml:space="preserve" class="faint" text-anchor="middle">the handler is swapped, not diffed</text><line x1="273" y1="170" x2="301" y2="170" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><line x1="578" y1="170" x2="606" y2="170" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="0" y="326" width="430" height="124" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="18" y="352" font-size="14.5" xml:space="preserve" font-weight="700">Gone</text><text x="62" y="352" font-size="12.5" xml:space="preserve" class="muted">from the bundle and from every render</text><rect x="18" y="366" width="62" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="49.0" y="385" font-size="12" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">React</text><line x1="30" y1="381" x2="68" y2="381" stroke="#f0883e" stroke-width="1.6"/><rect x="90" y="366" width="92" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="136.0" y="385" font-size="12" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">react-dom</text><line x1="102" y1="381" x2="170" y2="381" stroke="#f0883e" stroke-width="1.6"/><rect x="192" y="366" width="107" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="245.5" y="385" font-size="12" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">virtual DOM</text><line x1="204" y1="381" x2="287" y2="381" stroke="#f0883e" stroke-width="1.6"/><rect x="18" y="404" width="153" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="94.5" y="423" font-size="12" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">a tree per render</text><line x1="30" y1="419" x2="159" y2="419" stroke="#f0883e" stroke-width="1.6"/><rect x="181" y="404" width="92" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="227.0" y="423" font-size="12" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">tree diff</text><line x1="193" y1="419" x2="261" y2="419" stroke="#f0883e" stroke-width="1.6"/><rect x="283" y="404" width="62" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="314.0" y="423" font-size="12" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">fiber</text><line x1="295" y1="419" x2="333" y2="419" stroke="#f0883e" stroke-width="1.6"/><rect x="450" y="326" width="430" height="124" rx="14" fill="#221a38" stroke="#b58cff" stroke-width="1"/><text x="468" y="352" font-size="14.5" xml:space="preserve" font-weight="700">Stays</text><text x="512" y="352" font-size="12.5" xml:space="preserve" class="muted">your code compiles unchanged</text><rect x="468" y="366" width="138" height="28" rx="14" fill="#221a38" stroke="#b58cff" stroke-width="1.2"/><text x="537.0" y="385" font-size="12" xml:space="preserve" class="accent" font-weight="600" text-anchor="middle">your components</text><rect x="616" y="366" width="62" height="28" rx="14" fill="#221a38" stroke="#b58cff" stroke-width="1.2"/><text x="647.0" y="385" font-size="12" xml:space="preserve" class="accent" font-weight="600" text-anchor="middle">hooks</text><rect x="688" y="366" width="176" height="28" rx="14" fill="#221a38" stroke="#b58cff" stroke-width="1.2"/><text x="776.0" y="385" font-size="12" xml:space="preserve" class="accent" font-weight="600" text-anchor="middle">mlx · Reason · OCaml</text><rect x="468" y="404" width="84" height="28" rx="14" fill="#221a38" stroke="#b58cff" stroke-width="1.2"/><text x="510.0" y="423" font-size="12" xml:space="preserve" class="accent" font-weight="600" text-anchor="middle">ReactDOM</text><rect x="562" y="404" width="100" height="28" rx="14" fill="#221a38" stroke="#b58cff" stroke-width="1.2"/><text x="612.0" y="423" font-size="12" xml:space="preserve" class="accent" font-weight="600" text-anchor="middle">ReactEvent</text></svg>