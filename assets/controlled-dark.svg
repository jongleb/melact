<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 342" width="880" height="342" role="img" aria-label="Controlled inputs: the user types milk and presses Enter in the same tick; the model&#x27;s field goes from empty to milk and back to empty, so the redraw sees an unchanged value and writes nothing. A guard alone leaves milk in the field. In Meltea and Melact value and checked are controlled holes: after an input or change event and the redraw it causes, the hole writes its last value back if the DOM differs, as React does"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><text x="0" y="18" font-size="13" xml:space="preserve" font-weight="700">One tick: the user types and presses Enter before the next draw</text><rect x="0" y="34" width="270" height="92" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#lift)"/><text x="16" y="58" font-size="13" xml:space="preserve" font-weight="600">1 · the user types</text><text x="16" y="84" font-size="12.5" xml:space="preserve" class="mono"><tspan class="muted">input → </tspan><tspan class="accent">Type &quot;milk&quot;</tspan></text><text x="16" y="108" font-size="12" xml:space="preserve" class="mono muted">model.field = &quot;milk&quot;</text><line x1="276" y1="80" x2="299" y2="80" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="305" y="34" width="270" height="92" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#lift)"/><text x="321" y="58" font-size="13" xml:space="preserve" font-weight="600">2 · Enter, same tick</text><text x="321" y="84" font-size="12.5" xml:space="preserve" class="mono"><tspan class="muted">keydown → </tspan><tspan class="accent">Add</tspan></text><text x="321" y="108" font-size="12" xml:space="preserve" class="mono muted">model.field = &quot;&quot;</text><line x1="581" y1="80" x2="604" y2="80" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="610" y="34" width="270" height="92" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#lift)"/><text x="626" y="58" font-size="13" xml:space="preserve" font-weight="600">3 · the redraw</text><text x="626" y="84" font-size="12.5" xml:space="preserve" class="mono"><tspan class="mono">new &quot;&quot; === last &quot;&quot;</tspan></text><text x="626" y="108" font-size="12" xml:space="preserve" class="mono muted">unchanged → no write</text><rect x="0" y="150" width="420" height="150" rx="14" fill="#2b1d12" stroke="#f0883e" stroke-width="1.4"/><text x="20" y="176" font-size="13.5" xml:space="preserve" class="orange" font-weight="700">a guard alone</text><rect x="20" y="194" width="300" height="30" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.6"/><text x="30" y="214" font-size="13" xml:space="preserve" class="mono">milk</text><text x="20" y="252" font-size="12" xml:space="preserve" class="muted">the field still shows milk,</text><text x="20" y="272" font-size="12" xml:space="preserve" class="muted">the model says &quot;&quot;</text><rect x="460" y="150" width="420" height="150" rx="14" fill="#12261a" stroke="#3fb950" stroke-width="1.4"/><text x="480" y="176" font-size="13.5" xml:space="preserve" class="green" font-weight="700">value and checked are controlled holes</text><rect x="480" y="194" width="300" height="30" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="4 3"/><text x="490" y="214" font-size="13" xml:space="preserve" class="faint">What needs to be done?</text><text x="480" y="252" font-size="12" xml:space="preserve" class="muted">after input or change, and the redraw it causes:</text><text x="480" y="274" font-size="12.5" xml:space="preserve" class="mono">if (el.value !== last) <tspan class="green">el.value = last</tspan></text><text x="440" y="330" font-size="12.5" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">the guard still skips unchanged values; the field shows the model, as React&#x27;s controlled inputs</text></svg>