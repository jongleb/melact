<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" role="img" aria-label="React allocates a new element tree on every render and diffs it node by node; melact builds only an array of hole values and compares each with ===, then writes the changed holes"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #59636e; } .faint { fill: #8c959f; }.accent { fill: #8250df; } .green { fill: #1a7f37; }.orange { fill: #bc4c00; } .blue { fill: #0969da; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker></defs><text x="0" y="18" font-size="14" xml:space="preserve" font-weight="600">React with a virtual DOM</text><rect x="0" y="32" width="152" height="68" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/><text x="76" y="71" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">setState</text><line x1="154" y1="66" x2="178" y2="66" stroke="#59636e" stroke-width="1.6" marker-end="url(#arrow-muted)"/><rect x="182" y="32" width="152" height="68" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/><text x="258" y="71" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">render component</text><line x1="336" y1="66" x2="360" y2="66" stroke="#59636e" stroke-width="1.6" marker-end="url(#arrow-muted)"/><rect x="364" y="32" width="152" height="68" rx="12" fill="#fff4e8" stroke="#bc4c00" stroke-width="1.4"/><text x="440" y="62" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">new element tree</text><text x="440" y="82" font-size="11.5" xml:space="preserve" class="orange" text-anchor="middle">every tag allocated</text><line x1="518" y1="66" x2="542" y2="66" stroke="#59636e" stroke-width="1.6" marker-end="url(#arrow-muted)"/><rect x="546" y="32" width="152" height="68" rx="12" fill="#fff4e8" stroke="#bc4c00" stroke-width="1.4"/><text x="622" y="62" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">diff the trees</text><text x="622" y="82" font-size="11.5" xml:space="preserve" class="orange" text-anchor="middle">node by node</text><line x1="700" y1="66" x2="724" y2="66" stroke="#59636e" stroke-width="1.6" marker-end="url(#arrow-muted)"/><rect x="728" y="32" width="152" height="68" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/><text x="804" y="71" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">commit changes</text><text x="0" y="150" font-size="14" xml:space="preserve" font-weight="600">melact</text><rect x="0" y="164" width="152" height="68" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/><text x="76" y="203" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">setState</text><line x1="154" y1="198" x2="178" y2="198" stroke="#8250df" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="182" y="164" width="152" height="68" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/><text x="258" y="203" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">render component</text><line x1="336" y1="198" x2="360" y2="198" stroke="#8250df" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="364" y="164" width="152" height="68" rx="12" fill="#f5f0ff" stroke="#8250df" stroke-width="1.4"/><text x="440" y="194" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">hole array</text><text x="440" y="214" font-size="11.5" xml:space="preserve" class="accent" text-anchor="middle">static markup: nothing</text><line x1="518" y1="198" x2="542" y2="198" stroke="#8250df" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="546" y="164" width="152" height="68" rx="12" fill="#f5f0ff" stroke="#8250df" stroke-width="1.4"/><text x="622" y="194" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">=== per hole</text><text x="622" y="214" font-size="11.5" xml:space="preserve" class="accent" text-anchor="middle">no tree to walk</text><line x1="700" y1="198" x2="724" y2="198" stroke="#8250df" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="728" y="164" width="152" height="68" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/><text x="804" y="203" font-size="13.5" xml:space="preserve" font-weight="600" text-anchor="middle">write changed holes</text></svg>