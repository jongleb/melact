<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 478" width="896" height="478" role="img" aria-label="Inline props and lets are cached by what they capture. As React Compiler does, at build time: equal props keep a child from rendering. Values kept between renders in Melact: a badge update renders the parent of a list. As written, reason-react code makes a new filtered array, a new onPick closure and a new style on every render, so every Row&#x27;s props differ and 1,000 rows render. melact-ppx keeps each let and each value written in props, keyed by what it captures with ===: query and items are the same, so the old array comes back; item.id and pick are the same, so the same closure; so the props are equal and the rows are not rendered. A let changed in place afterwards, like a ref followed by :=, is made on every render, and state set and set back in one batch does not render"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #59636e; } .faint { fill: #8c959f; }.accent { fill: #8250df; } .green { fill: #1a7f37; }.orange { fill: #bc4c00; } .blue { fill: #0969da; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">VALUES KEPT BETWEEN RENDERS</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">Inline props and lets are cached by what they capture</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">As React Compiler does, at build time: equal props keep a child from rendering.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><text x="0" y="20" font-size="14" xml:space="preserve" class="mono accent" font-weight="700">notify</text><text x="62" y="20" font-size="12.5" xml:space="preserve" class="muted">changes a badge; the list&#x27;s parent renders, its rows&#x27; props did not change</text><rect x="0" y="52" width="420" height="262" rx="14" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.4" filter="url(#lift)"/><text x="18" y="80" font-size="13.5" xml:space="preserve" class="orange" font-weight="700">reason-react as written</text><text x="18" y="99" font-size="11.5" xml:space="preserve" class="muted">values made again on every render</text><text x="18" y="132" font-size="11.5" xml:space="preserve" class="mono">let visible = Js.Array.filter … items</text><text x="18" y="153" font-size="11.5" xml:space="preserve" class="mono"><tspan class="orange">  → a new array, every render</tspan></text><text x="18" y="174" font-size="11.5" xml:space="preserve" class="mono">&lt;Row item onPick=(fun () -&gt; pick item.id)</text><text x="18" y="195" font-size="11.5" xml:space="preserve" class="mono">     style=(Style.make ~color ()) /&gt;</text><text x="18" y="216" font-size="11.5" xml:space="preserve" class="mono"><tspan class="orange">  → a new closure and style, every render</tspan></text><text x="18" y="237" font-size="11.5" xml:space="preserve" class="mono"><tspan class="orange">  props !== last props → every Row renders</tspan></text><rect x="18" y="258" width="384" height="40" rx="10" fill="#fff4e8" stroke="#bc4c00" stroke-width="1.1"/><text x="32" y="283" font-size="12" xml:space="preserve" class="orange" font-weight="700">1,000 rows render for one badge</text><rect x="460" y="52" width="420" height="262" rx="14" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.4" filter="url(#lift)"/><text x="478" y="80" font-size="13.5" xml:space="preserve" class="green" font-weight="700">kept by what they capture</text><text x="478" y="99" font-size="11.5" xml:space="preserve" class="muted">melact-ppx caches each let and prop value</text><text x="478" y="132" font-size="11.5" xml:space="preserve" class="mono">let visible = kept [| query; items |] …</text><text x="478" y="153" font-size="11.5" xml:space="preserve" class="mono"><tspan class="green">  query === · items === → the old array</tspan></text><text x="478" y="174" font-size="11.5" xml:space="preserve" class="mono">onPick = kept [| item.id; pick |] (fun …)</text><text x="478" y="195" font-size="11.5" xml:space="preserve" class="mono">style = kept [| color |] (Style.make …)</text><text x="478" y="216" font-size="11.5" xml:space="preserve" class="mono"><tspan class="green">  captures === → the same values</tspan></text><text x="478" y="237" font-size="11.5" xml:space="preserve" class="mono"><tspan class="green">  props === last props → Row skipped</tspan></text><rect x="478" y="258" width="384" height="40" rx="10" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1.1"/><text x="492" y="283" font-size="12" xml:space="preserve" class="green" font-weight="700">the rows are not rendered</text><line x1="424" y1="183" x2="456" y2="183" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#arrow-green)" class="flow"/><text x="0" y="340" font-size="11.5" xml:space="preserve" class="mono">let total = ref 0 … total := …</text><text x="228" y="340" font-size="11.5" xml:space="preserve" class="muted">is changed in place afterwards, so it is made on every render;</text><text x="0" y="360" font-size="11.5" xml:space="preserve" class="mono">set n, then set it back in the same batch</text><text x="298" y="360" font-size="11.5" xml:space="preserve" class="muted">ends where it started, so the component does not render at all.</text></g></svg>